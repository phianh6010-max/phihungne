<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc Cô 20/11</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: hidden;
        font-family: "Poppins", sans-serif;
        background: radial-gradient(circle at top left, #ffb6d9, #ff92c2, #ff68a5, #ff7eb3);
        background-size: 250% 250%;
        animation: move 10s infinite alternate ease-in-out;
    }

    @keyframes move {
        0% { background-position: 0% 0%; }
        50% { background-position: 100% 80%; }
        100% { background-position: 0% 0%; }
    }

    .card {
        background: rgba(255, 255, 255, 0.75);
        padding: 25px 30px;
        border-radius: 20px;
        box-shadow: 0 8px 35px rgba(255, 120, 180, 0.5);
        backdrop-filter: blur(8px);
        max-width: 330px;
        animation: fadeIn 1.8s ease;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.8); }
        to   { opacity: 1; transform: scale(1); }
    }

    h1 {
        font-size: 2rem;
        color: #ff2e88;
        margin-bottom: 10px;
        text-shadow: 0 0 10px rgba(255, 140, 180, 0.8);
    }

    p {
        color: #ff3f9d;
        font-size: 1.2rem;
        line-height: 1.5;
        font-weight: 500;
    }

    .sparkle {
        position: absolute;
        width: 7px;
        height: 7px;
        background: rgba(255,255,255,0.9);
        border-radius: 50%;
        animation: sparkle 3s infinite ease-out;
    }

    @keyframes sparkle {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(2); opacity: 0; }
    }
</style>
</head>

<body>

<div class="card">
    <h1>💖 Chúc Cô 20/11 💖</h1>
    <p>
        Chúc cô 20/11 vui vẻ, hạnh phúc.<br>
        Lớp 10C1 mãi yêu cô ❤️<br>
        Và mong cô mau khỏi bệnh ạ 🌸
    </p>
</div>

<script>
    // tạo lấp lánh
    for (let i = 0; i < 35; i++) {
        let s = document.createElement("div");
        s.className = "sparkle";
        s.style.left = Math.random() * 100 + "vw";
        s.style.top = Math.random() * 100 + "vh";
        s.style.animationDuration = (1 + Math.random() * 3) + "s";
        document.body.appendChild(s);
    }
</script>

</body>
</html>
